<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Pong Game</h1>
            <div class="scoreboard">
                <div class="score">
                    <span class="label">Player</span>
                    <span class="value" id="playerScore">0</span>
                </div>
                <div class="score">
                    <span class="label">Computer</span>
                    <span class="value" id="computerScore">0</span>
                </div>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="instructions">
            <p><strong>Controls:</strong> Use Mouse or Arrow Keys (↑/↓) to move your paddle</p>
            <p><strong>Goal:</strong> Bounce the ball past your opponent's paddle to score</p>
            <button id="startBtn" class="btn">Start Game</button>
            <button id="resetBtn" class="btn">Reset Score</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
